<!doctype html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=720, height=1280">
<title>Interface qui apparaît autour de toi</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
@font-face{font-family:'Arial Black';src:local('Arial Black')}
@font-face{font-family:'Segoe UI Black';src:local('Segoe UI Black')}
@font-face{font-family:'Impact';src:local('Impact')}
@font-face{font-family:'Segoe UI';src:local('Segoe UI')}
@font-face{font-family:'Arial';src:local('Arial')}
@font-face{font-family:'Consolas';src:local('Consolas')}
@font-face{font-family:'Georgia';src:local('Georgia')}
@font-face{font-family:'Times New Roman';src:local('Times New Roman')}
@font-face{font-family:'Segoe Print';src:local('Segoe Print')}
@font-face{font-family:'Comic Sans MS';src:local('Comic Sans MS')}
@font-face{font-family:'Segoe UI Symbol';src:local('Segoe UI Symbol')}
@font-face{font-family:'Segoe Script';src:local('Segoe Script')}
html,body{margin:0;background:#000}
#root{position:relative;width:100%;height:100%;overflow:hidden;background:#000}
.a{position:absolute}
.vid{position:absolute;left:0;top:0;width:720px;height:1280px;object-fit:cover}
.heavy{font-family:'Arial Black','Segoe UI Black',Impact,sans-serif}
.ui{font-family:'Segoe UI',Arial,sans-serif}
#chip{position:absolute;left:22px;top:22px;padding:6px 16px;border-radius:20px;background:rgba(0,0,0,.6);color:#fff;
 font:700 22px 'Segoe UI',Arial,sans-serif;z-index:500}
#bgw{left:0;top:0;width:720px;height:1280px;background:linear-gradient(180deg,#0b1020,#1b2550)}
#dots{inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.14) 1.5px,transparent 2px);background-size:36px 36px}
#back,#front{left:0;top:0;width:720px;height:1280px}
.card{position:absolute;padding:18px;border-radius:22px;background:rgba(255,255,255,.95);color:#111;font-size:26px;box-shadow:0 18px 40px rgba(0,0,0,.45);box-sizing:content-box}
</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-width="720" data-height="1280" data-duration="5">
<div id="bgw" class="a"></div><div id="dots" class="a"></div>
<div id="back" class="a ui" style="z-index:2"></div>
<video id="cut" class="vid" src="cut.webm" muted playsinline data-start="0" data-duration="5" data-track-index="1" style="z-index:3"></video>
<div id="front" class="a ui" style="z-index:4"></div>
<svg id="cur" class="a" width="36" height="36" viewBox="0 0 24 24" style="z-index:5"><path d="M3 2l7 18 2.6-7.4L20 10z" fill="#fff" stroke="#000" stroke-width="1.5"/></svg>

</div>
<script>
const W=720,H=1280,FPS=30;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const io=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const eo=t=>1-Math.pow(1-clamp(t),3);
const lerp=(a,b,t)=>a+(b-a)*t;
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const rnd=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const $=id=>document.getElementById(id);
function run(draw){const tl=gsap.timeline({paused:true});const P={t:0};
  tl.to(P,{t:5,duration:5,ease:"none",onUpdate:()=>draw(P.t)},0);draw(0);window.__timelines["main"]=tl;}

run(t=>{
  const camX=Math.sin(t*1.1),camY=Math.cos(t*.9);
  const card=(x,y,w,z,t0,body)=>{const p=eo(seg(t,t0,t0+.6));
    return `<div class="card" style="left:${x+z*camX*26}px;top:${y+z*camY*14+Math.sin(t*2+x)*5}px;width:${w}px;opacity:${p};transform:perspective(900px) rotateY(${-camX*9}deg) scale(${.6+.4*p})">${body}</div>`};
  const click=seg(t,2.75,2.9),done=t>2.85;
  const cx=lerp(300,150,io(seg(t,1.9,2.7))),cy=lerp(1020,950,io(seg(t,1.9,2.7)));
  $("back").innerHTML=
   card(30,110,330,.2,.2,`<div style="display:flex;gap:14px;align-items:center"><div style="width:44px;height:44px;border-radius:22px;background:#22c55e;display:grid;place-items:center;color:#fff;font-size:28px">✓</div><div><b>Nouveau lead</b><div style="font-size:20px;color:#666">à l'instant</div></div></div>`)+
   card(390,90,300,.5,.5,`<div><div style="font-size:22px;color:#555">Envoi en cours</div><div style="height:14px;background:#e5e7eb;border-radius:8px;margin-top:10px"><div style="height:14px;border-radius:8px;background:#ff6a2b;width:${eo(seg(t,1,3.5))*100}%"></div></div></div>`)+
   card(470,290,220,.9,.8,`<div style="display:flex;align-items:center;justify-content:space-between;font-size:22px">Auto<div style="width:70px;height:38px;border-radius:20px;background:${t>2?"#22c55e":"#cbd5e1"};position:relative"><div style="position:absolute;top:4px;left:${t>2?36:4}px;width:30px;height:30px;border-radius:15px;background:#fff"></div></div></div>`)+
   card(20,380,230,.7,1.1,`<div style="font-size:24px">${t<1.9?"• • •":"Je m'en occupe."}</div>`);
  $("front").innerHTML=
   card(40,900,300,1.2,1.4,`<div style="background:${done?"#22c55e":"#ff6a2b"};color:#fff;text-align:center;border-radius:14px;padding:14px 0;font-weight:800;transform:scale(${1-.06*Math.sin(click*Math.PI)})">${done?"Envoyé":"Envoyer"}</div>`)+
   card(430,840,260,1.4,1.7,`<div style="display:flex;align-items:flex-end;gap:10px;height:100px">${[.4,.65,.5,.9].map((v,i)=>`<div style="flex:1;height:${100*v*eo(seg(t,1.9+i*.2,2.8+i*.2))}px;background:#6366f1;border-radius:6px"></div>`).join("")}</div>`);
  $("dots").style.backgroundPosition=`${camX*-20}px ${camY*-10}px`;
  $("cut").style.transform=`translateX(${camX*6}px)`;
  const c=$("cur");c.style.left=cx+"px";c.style.top=cy+"px";c.style.opacity=eo(seg(t,1.8,2.1));
});

</script></body></html>
