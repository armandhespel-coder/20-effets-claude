<!doctype html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=720, height=1280">
<title>Couverture de magazine</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
@font-face{font-family:'Arial Black';src:local('Arial Black')}
@font-face{font-family:'Segoe UI Black';src:local('Segoe UI Black')}
@font-face{font-family:'Impact';src:local('Impact')}
@font-face{font-family:'Segoe UI';src:local('Segoe UI')}
@font-face{font-family:'Arial';src:local('Arial')}
@font-face{font-family:'Consolas';src:local('Consolas')}
@font-face{font-family:'Georgia';src:local('Georgia')}
@font-face{font-family:'Times New Roman';src:local('Times New Roman')}
@font-face{font-family:'Segoe Print';src:local('Segoe Print')}
@font-face{font-family:'Comic Sans MS';src:local('Comic Sans MS')}
@font-face{font-family:'Segoe UI Symbol';src:local('Segoe UI Symbol')}
@font-face{font-family:'Segoe Script';src:local('Segoe Script')}
html,body{margin:0;background:#000}
#root{position:relative;width:100%;height:100%;overflow:hidden;background:#000}
.a{position:absolute}
.vid{position:absolute;left:0;top:0;width:720px;height:1280px;object-fit:cover}
.heavy{font-family:'Arial Black','Segoe UI Black',Impact,sans-serif}
.ui{font-family:'Segoe UI',Arial,sans-serif}
#chip{position:absolute;left:22px;top:22px;padding:6px 16px;border-radius:20px;background:rgba(0,0,0,.6);color:#fff;
 font:700 22px 'Segoe UI',Arial,sans-serif;z-index:500}
#bgw{inset:0;background:#202226}
#mag{left:40px;top:40px;width:640px;height:1200px;overflow:hidden;background:linear-gradient(170deg,#1d4ed8,#0a1536);box-shadow:0 30px 70px rgba(0,0,0,.6)}
#mast{left:0;right:0;top:50px;text-align:center;font-family:Georgia,'Times New Roman',serif;font-weight:900;font-size:230px;color:#fff;letter-spacing:-4px}
#ed{left:0;right:0;top:292px;text-align:center;font-weight:700;font-size:18px;letter-spacing:6px;color:#ffd23f}
#ct{inset:0}
#cut{transform-origin:360px 1280px;transform:translate(-40px,-80px) scale(1.15)}
#k1{left:28px;top:905px;width:330px;color:#fff;font-size:40px;line-height:1}
#k2{left:28px;right:28px;bottom:100px;color:#fff;font-size:54px;line-height:1;text-shadow:0 4px 16px rgba(0,0,0,.6)}
#bc{right:26px;bottom:24px;width:130px;height:50px;background:repeating-linear-gradient(90deg,#fff 0 3px,transparent 3px 6px,#fff 6px 7px,transparent 7px 11px);border:6px solid #fff;box-sizing:border-box}
</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-width="720" data-height="1280" data-duration="5">
<div id="bgw" class="a"></div>
<div id="mag" class="a">
 <div id="mast" class="a">FUTUR</div><div id="ed" class="a ui">ÉDITION SPÉCIALE · OCT. 2026</div>
 <div id="ct" class="a"><video id="cut" class="vid" src="cut.webm" muted playsinline data-start="0" data-duration="5" data-track-index="1"></video></div>
 <div id="k1" class="a heavy">17 EFFETS<div class="ui" style="font-weight:600;font-size:24px;margin-top:8px;color:#ffd23f">que l'IA sait créer</div></div>
 <div id="k2" class="a heavy">L'IA QUI MONTE<br>VOS VIDÉOS</div>
 <div id="bc" class="a"></div>
</div>

</div>
<script>
const W=720,H=1280,FPS=30;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const io=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const eo=t=>1-Math.pow(1-clamp(t),3);
const lerp=(a,b,t)=>a+(b-a)*t;
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const rnd=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const $=id=>document.getElementById(id);
function run(draw){const tl=gsap.timeline({paused:true});const P={t:0};
  tl.to(P,{t:5,duration:5,ease:"none",onUpdate:()=>draw(P.t)},0);draw(0);window.__timelines["main"]=tl;}

run(t=>{
  const a=io(seg(t,0,1)),p1=eo(seg(t,1,1.5)),p2=eo(seg(t,1.7,2.2));
  $("mag").style.transform=`translateY(${(1-a)*700}px) rotate(${(1-a)*-14}deg) scale(${lerp(.9,1,a)})`;
  $("k1").style.opacity=p1;$("k1").style.transform=`translateX(${(1-p1)*-60}px)`;
  $("k2").style.opacity=p2;$("k2").style.transform=`translateY(${(1-p2)*40}px)`;
});

</script></body></html>
