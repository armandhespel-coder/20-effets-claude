<!doctype html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=720, height=1280">
<title>Doodle dessiné à la main</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
@font-face{font-family:'Arial Black';src:local('Arial Black')}
@font-face{font-family:'Segoe UI Black';src:local('Segoe UI Black')}
@font-face{font-family:'Impact';src:local('Impact')}
@font-face{font-family:'Segoe UI';src:local('Segoe UI')}
@font-face{font-family:'Arial';src:local('Arial')}
@font-face{font-family:'Consolas';src:local('Consolas')}
@font-face{font-family:'Georgia';src:local('Georgia')}
@font-face{font-family:'Times New Roman';src:local('Times New Roman')}
@font-face{font-family:'Segoe Print';src:local('Segoe Print')}
@font-face{font-family:'Comic Sans MS';src:local('Comic Sans MS')}
@font-face{font-family:'Segoe UI Symbol';src:local('Segoe UI Symbol')}
@font-face{font-family:'Segoe Script';src:local('Segoe Script')}
html,body{margin:0;background:#000}
#root{position:relative;width:100%;height:100%;overflow:hidden;background:#000}
.a{position:absolute}
.vid{position:absolute;left:0;top:0;width:720px;height:1280px;object-fit:cover}
.heavy{font-family:'Arial Black','Segoe UI Black',Impact,sans-serif}
.ui{font-family:'Segoe UI',Arial,sans-serif}
#chip{position:absolute;left:22px;top:22px;padding:6px 16px;border-radius:20px;background:rgba(0,0,0,.6);color:#fff;
 font:700 22px 'Segoe UI',Arial,sans-serif;z-index:500}
</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-width="720" data-height="1280" data-duration="5">
<video class="vid" src="clip.mp4" muted playsinline data-start="0" data-duration="5" data-track-index="0" style="filter:brightness(.85)"></video>
<svg class="a" width="720" height="1280" style="left:0;top:0;z-index:3">
 <filter id="boil" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence id="turb" type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="0"/><feDisplacementMap in="SourceGraphic" scale="10"/></filter>
 <g filter="url(#boil)">
  <g id="g0"><path class="d" data-a="0.3" data-b="1.4" stroke="#ffe14d" stroke-width="9" d="M120 700 C110 430 300 330 430 360 C580 400 600 620 570 780 C540 960 380 1040 260 1000 C140 950 115 800 125 690 C135 640 150 600 200 560"/></g>
  <path class="d" data-a="1.3" data-b="2.0" stroke="#fff" stroke-width="9" d="M60 230 C40 330 90 420 150 470"/>
  <path class="d" data-a="1.9" data-b="2.2" stroke="#fff" stroke-width="9" d="M150 470 L112 452 M150 470 L155 425"/>
  <g id="wow"><text x="330" y="230" font-family="'Segoe Print','Comic Sans MS',cursive" font-weight="900" font-size="120" fill="#ffe14d" stroke="#000" stroke-width="2">WOW!</text></g>
  <path class="d" data-a="2.4" data-b="3.0" stroke="#ff5fa2" stroke-width="9" d="M340 272 l30 -14 l30 14 l30 -14 l30 14 l30 -14 l30 14 l30 -14"/>
  <path id="s1" class="d" data-a="2.9" data-b="3.5" stroke="#fff" stroke-width="7"/>
  <path id="s2" class="d" data-a="3.2" data-b="3.8" stroke="#ffe14d" stroke-width="7"/>
  <path id="s3" class="d" data-a="3.5" data-b="4.1" stroke="#ff5fa2" stroke-width="7"/>
 </g>
</svg>

</div>
<script>
const W=720,H=1280,FPS=30;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const io=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const eo=t=>1-Math.pow(1-clamp(t),3);
const lerp=(a,b,t)=>a+(b-a)*t;
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const rnd=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const $=id=>document.getElementById(id);
function run(draw){const tl=gsap.timeline({paused:true});const P={t:0};
  tl.to(P,{t:5,duration:5,ease:"none",onUpdate:()=>draw(P.t)},0);draw(0);window.__timelines["main"]=tl;}

const star=(cx,cy,r)=>Array.from({length:10}).map((_,i)=>{const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;return `${i?"L":"M"}${cx+rr*Math.cos(a)} ${cy+rr*Math.sin(a)}`}).join("")+"Z";
$("s1").setAttribute("d",star(80,980,52));$("s2").setAttribute("d",star(640,1060,46));$("s3").setAttribute("d",star(620,90,40));
const ds=[...document.querySelectorAll(".d")];
ds.forEach(p=>{p.setAttribute("fill","none");p.setAttribute("stroke-linecap","round");p.setAttribute("stroke-linejoin","round");p.setAttribute("pathLength","1");p.style.strokeDasharray=1});
run(t=>{
  const f=Math.round(t*FPS);
  $("turb").setAttribute("seed",Math.floor(f/3)%7);
  ds.forEach(p=>p.style.strokeDashoffset=1-io(seg(t,+p.dataset.a,+p.dataset.b)));
  $("g0").setAttribute("opacity",1-seg(t,3,3.4));
  $("wow").setAttribute("transform",`rotate(8 500 200) translate(500 200) scale(${eo(seg(t,1.9,2.4))}) translate(-500 -200)`);
});

</script></body></html>
