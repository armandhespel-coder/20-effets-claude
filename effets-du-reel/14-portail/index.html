<!doctype html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=720, height=1280">
<title>Portail vers une autre scène</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
@font-face{font-family:'Arial Black';src:local('Arial Black')}
@font-face{font-family:'Segoe UI Black';src:local('Segoe UI Black')}
@font-face{font-family:'Impact';src:local('Impact')}
@font-face{font-family:'Segoe UI';src:local('Segoe UI')}
@font-face{font-family:'Arial';src:local('Arial')}
@font-face{font-family:'Consolas';src:local('Consolas')}
@font-face{font-family:'Georgia';src:local('Georgia')}
@font-face{font-family:'Times New Roman';src:local('Times New Roman')}
@font-face{font-family:'Segoe Print';src:local('Segoe Print')}
@font-face{font-family:'Comic Sans MS';src:local('Comic Sans MS')}
@font-face{font-family:'Segoe UI Symbol';src:local('Segoe UI Symbol')}
@font-face{font-family:'Segoe Script';src:local('Segoe Script')}
html,body{margin:0;background:#000}
#root{position:relative;width:100%;height:100%;overflow:hidden;background:#000}
.a{position:absolute}
.vid{position:absolute;left:0;top:0;width:720px;height:1280px;object-fit:cover}
.heavy{font-family:'Arial Black','Segoe UI Black',Impact,sans-serif}
.ui{font-family:'Segoe UI',Arial,sans-serif}
#chip{position:absolute;left:22px;top:22px;padding:6px 16px;border-radius:20px;background:rgba(0,0,0,.6);color:#fff;
 font:700 22px 'Segoe UI',Arial,sans-serif;z-index:500}
.scene{inset:0}
.ring{border:14px solid #fff;border-radius:50%;box-sizing:border-box;box-shadow:0 0 40px rgba(255,255,255,.6),inset 0 0 40px rgba(255,255,255,.4)}
.ttl{left:0;right:0;text-align:center;color:#fff;line-height:.95;text-shadow:0 8px 24px rgba(0,0,0,.35)}
</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-width="720" data-height="1280" data-duration="5">
<video class="vid" src="clip.mp4" muted playsinline data-start="0" data-duration="5" data-track-index="0"></video>
<div id="B" class="a scene" style="background:linear-gradient(160deg,#ff7a1a,#ffb347);z-index:2">
 <div class="a ttl heavy" style="top:70px;font-size:120px">NOUVEAU<br>MONDE</div>
 <video class="vid" src="cut.webm" muted playsinline data-start="0" data-duration="5" data-track-index="1" style="filter:drop-shadow(0 20px 30px rgba(0,0,0,.35))"></video>
</div>
<div id="C" class="a scene" style="background:linear-gradient(170deg,#12002b,#3a0a63 60%,#ff2e97);z-index:4">
 <div id="grid" class="a" style="left:-640px;top:900px;width:2000px;height:900px;transform-origin:50% 0;transform:perspective(300px) rotateX(58deg);background-image:linear-gradient(rgba(255,46,151,.9) 3px,transparent 3px),linear-gradient(90deg,rgba(255,46,151,.9) 3px,transparent 3px);background-size:90px 90px"></div>
 <div class="a ttl heavy" style="top:70px;font-size:105px">ENCORE<br>UN AUTRE</div>
 <video class="vid" src="cut.webm" muted playsinline data-start="0" data-duration="5" data-track-index="2"></video>
</div>
<div id="rB" class="a ring" style="z-index:3"></div>
<div id="rC" class="a ring" style="z-index:5"></div>

</div>
<script>
const W=720,H=1280,FPS=30;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const io=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const eo=t=>1-Math.pow(1-clamp(t),3);
const lerp=(a,b,t)=>a+(b-a)*t;
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const rnd=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const $=id=>document.getElementById(id);
function run(draw){const tl=gsap.timeline({paused:true});const P={t:0};
  tl.to(P,{t:5,duration:5,ease:"none",onUpdate:()=>draw(P.t)},0);draw(0);window.__timelines["main"]=tl;}

const CX=360,CY=700;
function iris(scene,ring,p,fade){const R=1700*p;
  scene.style.clipPath=`circle(${R}px at ${CX}px ${CY}px)`;
  ring.style.left=(CX-R)+"px";ring.style.top=(CY-R)+"px";ring.style.width=ring.style.height=(2*R)+"px";
  ring.style.opacity=p<=0?0:clamp(1-seg(p,.85,1))*fade;}
run(t=>{
  iris($("B"),$("rB"),io(seg(t,.9,2.1)),1);
  iris($("C"),$("rC"),io(seg(t,2.9,4.1)),1);
  $("grid").style.backgroundPosition=`0 ${(t*120)%90}px`;
});

</script></body></html>
