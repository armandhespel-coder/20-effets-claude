<!doctype html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=720, height=1280">
<title>Toi dans un téléphone</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
@font-face{font-family:'Arial Black';src:local('Arial Black')}
@font-face{font-family:'Segoe UI Black';src:local('Segoe UI Black')}
@font-face{font-family:'Impact';src:local('Impact')}
@font-face{font-family:'Segoe UI';src:local('Segoe UI')}
@font-face{font-family:'Arial';src:local('Arial')}
@font-face{font-family:'Consolas';src:local('Consolas')}
@font-face{font-family:'Georgia';src:local('Georgia')}
@font-face{font-family:'Times New Roman';src:local('Times New Roman')}
@font-face{font-family:'Segoe Print';src:local('Segoe Print')}
@font-face{font-family:'Comic Sans MS';src:local('Comic Sans MS')}
@font-face{font-family:'Segoe UI Symbol';src:local('Segoe UI Symbol')}
@font-face{font-family:'Segoe Script';src:local('Segoe Script')}
html,body{margin:0;background:#000}
#root{position:relative;width:100%;height:100%;overflow:hidden;background:#000}
.a{position:absolute}
.vid{position:absolute;left:0;top:0;width:720px;height:1280px;object-fit:cover}
.heavy{font-family:'Arial Black','Segoe UI Black',Impact,sans-serif}
.ui{font-family:'Segoe UI',Arial,sans-serif}
#chip{position:absolute;left:22px;top:22px;padding:6px 16px;border-radius:20px;background:rgba(0,0,0,.6);color:#fff;
 font:700 22px 'Segoe UI',Arial,sans-serif;z-index:500}
#bgw{inset:0;background:linear-gradient(160deg,#5b21b6,#db2777)}
#reel{top:60px;font-size:330px;color:transparent;-webkit-text-stroke:4px rgba(255,255,255,.45);white-space:nowrap}
#phone{left:160px;top:230px;width:400px;height:820px;border-radius:70px;border:14px solid #0c0c0f;background:#000;overflow:hidden;box-shadow:0 40px 80px rgba(0,0,0,.55);box-sizing:content-box;z-index:2}
#notch{top:12px;left:50%;margin-left:-55px;width:110px;height:32px;border-radius:20px;background:#000}
#shade{left:0;right:0;bottom:0;height:180px;background:linear-gradient(transparent,rgba(0,0,0,.6))}
.bub{position:absolute;padding:10px 22px;border-radius:30px;color:#fff;font-weight:800;font-size:28px;box-shadow:0 10px 24px rgba(0,0,0,.35);z-index:3;white-space:nowrap}
</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-width="720" data-height="1280" data-duration="5">
<div id="bgw" class="a"></div><div id="reel" class="a heavy">REEL</div>
<div id="phone" class="a"><video src="clip.mp4" class="vid" muted playsinline data-start="0" data-duration="5" data-track-index="0" style="width:100%;height:100%"></video><div id="notch" class="a"></div><div id="shade" class="a"></div></div>
<div class="bub ui" id="b1" style="left:40px;top:300px;background:#22c55e">+1 abonné</div>
<div class="bub ui" id="b2" style="left:400px;top:190px;background:#3b82f6">12 commentaires</div>
<div class="bub ui" id="b3" style="left:450px;top:1020px;background:#f59e0b">PARTAGÉ</div>

</div>
<script>
const W=720,H=1280,FPS=30;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const io=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const eo=t=>1-Math.pow(1-clamp(t),3);
const lerp=(a,b,t)=>a+(b-a)*t;
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const rnd=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const $=id=>document.getElementById(id);
function run(draw){const tl=gsap.timeline({paused:true});const P={t:0};
  tl.to(P,{t:5,duration:5,ease:"none",onUpdate:()=>draw(P.t)},0);draw(0);window.__timelines["main"]=tl;}

const bub=[[$("b1"),300,2],[$("b2"),190,2.7],[$("b3"),1020,3.3]];
run(t=>{
  const a=io(seg(t,0,1.5)),rotY=lerp(-65,-12,a)+14*Math.sin(t*1.3)*seg(t,1.2,2);
  $("reel").style.left=lerp(60,-20,t/5)+"px";
  $("phone").style.transform=`perspective(1600px) translateY(${lerp(900,0,a)}px) rotateX(${lerp(22,5,a)}deg) rotateY(${rotY}deg) rotateZ(${lerp(14,-4,a)}deg) scale(${lerp(.7,1,a)})`;
  bub.forEach(([e,y,t0])=>{const p=eo(seg(t,t0,t0+.5));e.style.top=(y-18*p)+"px";e.style.transform=`scale(${p})`;e.style.opacity=p});
});

</script></body></html>
