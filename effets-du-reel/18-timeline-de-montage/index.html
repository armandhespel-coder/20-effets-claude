<!doctype html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=720, height=1280">
<title>Timeline de montage</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
@font-face{font-family:'Arial Black';src:local('Arial Black')}
@font-face{font-family:'Segoe UI Black';src:local('Segoe UI Black')}
@font-face{font-family:'Impact';src:local('Impact')}
@font-face{font-family:'Segoe UI';src:local('Segoe UI')}
@font-face{font-family:'Arial';src:local('Arial')}
@font-face{font-family:'Consolas';src:local('Consolas')}
@font-face{font-family:'Georgia';src:local('Georgia')}
@font-face{font-family:'Times New Roman';src:local('Times New Roman')}
@font-face{font-family:'Segoe Print';src:local('Segoe Print')}
@font-face{font-family:'Comic Sans MS';src:local('Comic Sans MS')}
@font-face{font-family:'Segoe UI Symbol';src:local('Segoe UI Symbol')}
@font-face{font-family:'Segoe Script';src:local('Segoe Script')}
html,body{margin:0;background:#000}
#root{position:relative;width:100%;height:100%;overflow:hidden;background:#000}
.a{position:absolute}
.vid{position:absolute;left:0;top:0;width:720px;height:1280px;object-fit:cover}
.heavy{font-family:'Arial Black','Segoe UI Black',Impact,sans-serif}
.ui{font-family:'Segoe UI',Arial,sans-serif}
#chip{position:absolute;left:22px;top:22px;padding:6px 16px;border-radius:20px;background:rgba(0,0,0,.6);color:#fff;
 font:700 22px 'Segoe UI',Arial,sans-serif;z-index:500}
#bgw{inset:0;background:#14161a}
#top{left:200px;top:34px;font:700 24px 'Segoe UI',Arial,sans-serif;color:#9aa3b2;letter-spacing:2px}
#step{right:40px;top:26px;padding:8px 22px;border-radius:24px;background:#ff6a2b;color:#fff;font:800 24px 'Segoe UI',Arial,sans-serif}
#prev{left:110px;top:90px;width:500px;height:680px;border-radius:18px;overflow:hidden;border:2px solid #2a2d34;box-shadow:0 20px 50px rgba(0,0,0,.5)}
#ptitle{left:0;bottom:70px;padding:10px 26px;background:#ff6a2b;color:#fff;font-size:44px}
#tc{left:0;right:0;top:784px;text-align:center;font:30px Consolas,monospace;color:#e5e7eb}
#panel{left:20px;right:20px;top:840px;height:410px;border-radius:20px;background:#1d2026;border:1px solid #2a2d34}
.tl{font:700 18px 'Segoe UI',Arial,sans-serif;color:#6b7280;position:absolute;left:30px}
.blk{position:absolute;border-radius:8px;box-sizing:border-box}
#ph{width:3px;background:#ff3b30;z-index:6;top:872px;height:360px;box-shadow:0 0 12px rgba(255,59,48,.8)}
#phh{position:absolute;left:-8px;top:-4px;width:19px;height:16px;background:#ff3b30;clip-path:polygon(0 0,100% 0,50% 100%)}
#sc{font:30px 'Segoe UI Symbol','Segoe UI',sans-serif;color:#fff;z-index:7}
</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-width="720" data-height="1280" data-duration="5">
<div id="bgw" class="a"></div>
<div id="top" class="a">PROJET_FINAL</div><div id="step" class="a"></div>
<div id="prev" class="a"><video class="vid" style="width:500px;height:889px;top:-70px" src="clip.mp4" muted playsinline data-start="0" data-duration="5" data-track-index="0"></video><div id="ptitle" class="a heavy">PLUS RAPIDE</div></div>
<div id="tc" class="a"></div>
<div id="panel" class="a"></div>
<div id="tl" class="a" style="inset:0"></div>
<div id="ph" class="a"><div id="phh"></div></div>
<div id="sc" class="a">✂</div>

</div>
<script>
const W=720,H=1280,FPS=30;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const io=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const eo=t=>1-Math.pow(1-clamp(t),3);
const lerp=(a,b,t)=>a+(b-a)*t;
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const rnd=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const $=id=>document.getElementById(id);
function run(draw){const tl=gsap.timeline({paused:true});const P={t:0};
  tl.to(P,{t:5,duration:5,ease:"none",onUpdate:()=>draw(P.t)},0);draw(0);window.__timelines["main"]=tl;}

const X0=40,X1=680,CA=240,CB=410,Y={tt:884,v:960,a:1058,s:1138};
$("tl").innerHTML=`<div class="tl a" style="top:${Y.tt+4}px;left:50px"></div>`;
const tracks=[["Titre",Y.tt-2],["V1",Y.v+30],["A1",Y.a+14],["Sous-titres",Y.s+8]];
const bars=Array.from({length:64},(_,i)=>({x:X0+i*10,h:10+rnd(i+4)*34}));
run(t=>{
  const del=io(seg(t,2.2,3.0)),delta=(CB-CA)*del,cut1=seg(t,1.35,1.5),cut2=seg(t,1.65,1.8);
  const stepTxt=t<1.3?"IMPORT":t<2.2?"COUPE":t<3.1?"SUPPRESSION":t<3.9?"TITRE":"SOUS-TITRES";$("step").textContent=stepTxt;
  let h="";
  tracks.forEach(([n,y])=>h+=`<div class="tl" style="top:${y-4}px;left:30px;display:none">${n}</div>`);
  for(let x=X0;x<=X1;x+=40)h+=`<div class="a" style="left:${x}px;top:858px;width:1px;height:${x%80===0?14:8}px;background:#3a3f4a"></div>`;
  const vy=Y.v,vh=76,col="#ff6a2b";
  const th="background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.18) 0 2px,transparent 2px 46px)";
  h+=`<div class="blk" style="left:${X0}px;top:${vy}px;width:${CA-X0}px;height:${vh}px;background:${col};${th}"></div>`;
  const mw=(CB-CA)*(1-del);
  if(mw>.5)h+=`<div class="blk" style="left:${CA}px;top:${vy}px;width:${mw}px;height:${vh}px;background:${t>1.9?"#b91c1c":col};opacity:${1-del*.6};${th}"></div>`;
  h+=`<div class="blk" style="left:${CB-delta}px;top:${vy}px;width:${X1-CB}px;height:${vh}px;background:${col};${th}"></div>`;
  [[CA,cut1],[CB,cut2]].forEach(([x,c])=>{if(c>0&&del<.05)h+=`<div class="a" style="left:${x-1}px;top:${vy-12}px;width:3px;height:${vh+24}px;background:#fff;opacity:${1-seg(c,.5,1)*.4};box-shadow:0 0 12px #fff"></div>`});
  bars.forEach(b=>{let x=b.x,o=1,sx=1;
    if(b.x>=CA&&b.x<CB){x=CA+(b.x-CA)*(1-del);o=1-del;}else if(b.x>=CB)x=b.x-delta;
    h+=`<div class="a" style="left:${x}px;top:${Y.a+38-b.h/2}px;width:6px;height:${b.h}px;border-radius:3px;background:#34d399;opacity:${o};${b.x>=CA&&b.x<CB&&t>1.9?"background:#f87171":""}"></div>`});
  const tp=eo(seg(t,3.0,3.5));
  h+=`<div class="blk" style="left:${X0+30}px;top:${Y.tt+(1-tp)*-30}px;width:230px;height:46px;background:#3b82f6;opacity:${tp};color:#fff;font:800 22px 'Segoe UI',Arial,sans-serif;padding:10px 14px">T  PLUS RAPIDE</div>`;
  for(let i=0;i<4;i++){const sp=eo(seg(t,3.6+i*.25,4.0+i*.25));
    h+=`<div class="blk" style="left:${X0+20+i*118}px;top:${Y.s+(1-sp)*14}px;width:104px;height:38px;background:#a78bfa;opacity:${sp}"></div>`}
  $("tl").innerHTML=h;
  const px=X0+(X1-X0-0)*(t/5)*.735;$("ph").style.left=px+"px";
  const sx=$("sc");const sa=Math.max(Math.sin(Math.PI*seg(t,1.3,1.55)),Math.sin(Math.PI*seg(t,1.6,1.85)));
  sx.style.left=(t<1.6?CA:CB)-14+"px";sx.style.top=(vy-52)+"px";sx.style.opacity=sa;
  $("ptitle").style.transform=`translateX(${(1-eo(seg(t,3.3,3.9)))*-520}px)`;
  const ft=Math.floor(t*30);$("tc").textContent=`00:0${Math.floor(t)}:${String(ft%30).padStart(2,"0")}`;
});

</script></body></html>
