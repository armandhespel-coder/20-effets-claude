<!doctype html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=720, height=1280">
<title>Découpe papier</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
@font-face{font-family:'Arial Black';src:local('Arial Black')}
@font-face{font-family:'Segoe UI Black';src:local('Segoe UI Black')}
@font-face{font-family:'Impact';src:local('Impact')}
@font-face{font-family:'Segoe UI';src:local('Segoe UI')}
@font-face{font-family:'Arial';src:local('Arial')}
@font-face{font-family:'Consolas';src:local('Consolas')}
@font-face{font-family:'Georgia';src:local('Georgia')}
@font-face{font-family:'Times New Roman';src:local('Times New Roman')}
@font-face{font-family:'Segoe Print';src:local('Segoe Print')}
@font-face{font-family:'Comic Sans MS';src:local('Comic Sans MS')}
@font-face{font-family:'Segoe UI Symbol';src:local('Segoe UI Symbol')}
@font-face{font-family:'Segoe Script';src:local('Segoe Script')}
html,body{margin:0;background:#000}
#root{position:relative;width:100%;height:100%;overflow:hidden;background:#000}
.a{position:absolute}
.vid{position:absolute;left:0;top:0;width:720px;height:1280px;object-fit:cover}
.heavy{font-family:'Arial Black','Segoe UI Black',Impact,sans-serif}
.ui{font-family:'Segoe UI',Arial,sans-serif}
#chip{position:absolute;left:22px;top:22px;padding:6px 16px;border-radius:20px;background:rgba(0,0,0,.6);color:#fff;
 font:700 22px 'Segoe UI',Arial,sans-serif;z-index:500}
#bgw{inset:0;background:#efe6d2}
#cutimgs img{position:absolute;left:0;top:0;width:720px;height:1280px;opacity:0;z-index:4}
.lay{position:absolute}
#tag{left:40px;padding:6px 34px;background:#fff;color:#111;font-size:90px;box-shadow:3px 7px 6px rgba(0,0,0,.3);z-index:5;white-space:nowrap;
 clip-path:polygon(0 6%,3% 0,8% 8%,15% 0,22% 7%,30% 0,45% 6%,60% 0,75% 7%,90% 0,100% 6%,98% 50%,100% 94%,92% 100%,80% 93%,66% 100%,50% 94%,35% 100%,20% 93%,8% 100%,0 94%,2% 50%)}
</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-width="720" data-height="1280" data-duration="5">
<div id="bgw" class="a"></div>
<svg class="a" width="720" height="1280" style="left:0;top:0;opacity:.25"><filter id="pp"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2"/><feColorMatrix values="0 0 0 0 0.4  0 0 0 0 0.3  0 0 0 0 0.2  0 0 0 .9 0"/></filter><rect width="720" height="1280" filter="url(#pp)"/></svg>
<div id="layers"></div>
<div id="tag" class="a heavy">PAPER CUT</div>
<div id="cutimgs"></div>

</div>
<script>
const W=720,H=1280,FPS=30;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const io=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const eo=t=>1-Math.pow(1-clamp(t),3);
const lerp=(a,b,t)=>a+(b-a)*t;
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const rnd=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const $=id=>document.getElementById(id);
function run(draw){const tl=gsap.timeline({paused:true});const P={t:0};
  tl.to(P,{t:5,duration:5,ease:"none",onUpdate:()=>draw(P.t)},0);draw(0);window.__timelines["main"]=tl;}

const torn=(w,h,seed,step=28,amp=12)=>{const p=[],n1=Math.round(w/step),n2=Math.round(h/step);
  for(let i=0;i<=n1;i++)p.push(`${i*w/n1},${rnd(seed+i)*amp}`);
  for(let i=1;i<=n2;i++)p.push(`${w-rnd(seed+40+i)*amp},${i*h/n2}`);
  for(let i=n1-1;i>=0;i--)p.push(`${i*w/n1},${h-rnd(seed+80+i)*amp}`);
  for(let i=n2-1;i>0;i--)p.push(`${rnd(seed+120+i)*amp},${i*h/n2}`);return p.join(" ")};
const L=[{c:"#ff6b35",w:820,h:640,x:-50,y:120,r:-6,s:1,side:-1},{c:"#ffd166",w:700,h:520,x:80,y:520,r:5,s:2,side:1},{c:"#06d6a0",w:600,h:460,x:-60,y:800,r:-3,s:3,side:-1}];
const lay=L.map(l=>{const e=document.createElementNS("http://www.w3.org/2000/svg","svg");e.setAttribute("width",l.w);e.setAttribute("height",l.h);
  e.setAttribute("class","lay");e.style.filter="drop-shadow(3px 7px 6px rgba(0,0,0,.35))";
  e.innerHTML=`<polygon points="${torn(l.w,l.h,l.s*7)}" fill="${l.c}"/>`;$("layers").appendChild(e);return e});
const imgs=[];for(let k=0;k<50;k++){const im=document.createElement("img");im.src=`cut/${String(k*3+1).padStart(3,"0")}.png`;$("cutimgs").appendChild(im);imgs.push(im)}
const ring=[[5,0],[-5,0],[0,5],[0,-5],[4,4],[-4,-4],[4,-4],[-4,4]];
$("cutimgs").style.filter=ring.map(([x,y])=>`drop-shadow(${x}px ${y}px 0 #fff)`).join(" ")+" drop-shadow(4px 10px 8px rgba(0,0,0,.4))";
let last=-1;
run(tt=>{
  const f=Math.min(149,Math.round(tt*FPS)),k=Math.floor(f/3),t=k*3/FPS;
  L.forEach((l,i)=>{const p=eo(seg(t,.1+i*.3,.8+i*.3)),e=lay[i];
    e.style.left=(l.x+(1-p)*l.side*900+(rnd(k+i*9)-.5)*6)+"px";e.style.top=(l.y+(rnd(k*3+i)-.5)*6)+"px";
    e.style.transform=`rotate(${l.r+(rnd(k+i*5)-.5)*1.4}deg)`});
  const tg=$("tag");tg.style.top=(110+(rnd(k)-.5)*4)+"px";
  tg.style.transform=`rotate(${-4+(rnd(k+3)-.5)}deg) translateX(${(1-eo(seg(t,1.2,1.8)))*-900}px)`;
  if(k!==last){if(last>=0)imgs[last].style.opacity=0;imgs[k].style.opacity=1;last=k}
});

</script></body></html>
