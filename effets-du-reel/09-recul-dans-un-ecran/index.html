<!doctype html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=720, height=1280">
<title>Recul : tu es dans un écran</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
@font-face{font-family:'Arial Black';src:local('Arial Black')}
@font-face{font-family:'Segoe UI Black';src:local('Segoe UI Black')}
@font-face{font-family:'Impact';src:local('Impact')}
@font-face{font-family:'Segoe UI';src:local('Segoe UI')}
@font-face{font-family:'Arial';src:local('Arial')}
@font-face{font-family:'Consolas';src:local('Consolas')}
@font-face{font-family:'Georgia';src:local('Georgia')}
@font-face{font-family:'Times New Roman';src:local('Times New Roman')}
@font-face{font-family:'Segoe Print';src:local('Segoe Print')}
@font-face{font-family:'Comic Sans MS';src:local('Comic Sans MS')}
@font-face{font-family:'Segoe UI Symbol';src:local('Segoe UI Symbol')}
@font-face{font-family:'Segoe Script';src:local('Segoe Script')}
html,body{margin:0;background:#000}
#root{position:relative;width:100%;height:100%;overflow:hidden;background:#000}
.a{position:absolute}
.vid{position:absolute;left:0;top:0;width:720px;height:1280px;object-fit:cover}
.heavy{font-family:'Arial Black','Segoe UI Black',Impact,sans-serif}
.ui{font-family:'Segoe UI',Arial,sans-serif}
#chip{position:absolute;left:22px;top:22px;padding:6px 16px;border-radius:20px;background:rgba(0,0,0,.6);color:#fff;
 font:700 22px 'Segoe UI',Arial,sans-serif;z-index:500}
#bgw{inset:0;background:#d8cdb8}
#world{left:0;top:0;width:720px;height:1280px;transform-origin:360px 560px}
#world>div{position:absolute}
#scr{left:150px;top:220px;width:420px;height:680px;overflow:hidden;border-radius:8px}
</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-width="720" data-height="1280" data-duration="5">
<div id="bgw" class="a"></div>
<div id="world" class="a">
 <div style="left:-2000px;top:-2000px;width:4720px;height:3016px;background:linear-gradient(#efe6d6,#d9cbb2)"></div>
 <div style="left:-2000px;top:1016px;width:4720px;height:3000px;background:linear-gradient(#8a5a36,#5e3a20)"></div>
 <div style="left:-140px;top:40px;width:200px;height:380px;background:linear-gradient(#bfe3ff,#e9f6ff);border:10px solid #fff;box-shadow:0 0 0 3px #bbb"></div>
 <div style="left:520px;top:340px;width:360px;height:10px;background:#6b4a2b"></div>
 <div id="books"></div>
 <div style="left:590px;top:880px;width:90px;height:136px;background:#7c4a2d;border-radius:0 0 14px 14px"></div>
 <div id="plant"></div>
 <div style="left:90px;top:930px;width:70px;height:86px;background:#fff;border-radius:0 0 16px 16px;box-shadow:inset 0 -14px 0 #6b4226"></div>
 <div style="left:335px;top:910px;width:50px;height:100px;background:#9ca3af"></div>
 <div style="left:250px;top:1000px;width:220px;height:16px;background:#6b7280;border-radius:8px"></div>
 <div style="left:135px;top:205px;width:450px;height:710px;background:#111;border-radius:26px;box-shadow:0 24px 40px rgba(0,0,0,.4)"></div>
 <div id="scr"><video class="vid" src="clip.mp4" muted playsinline data-start="0" data-duration="5" data-track-index="0" style="width:100%;height:100%"></video>
  <div style="position:absolute;inset:0;background:linear-gradient(125deg,rgba(255,255,255,.18),transparent 40%)"></div></div>
</div>

</div>
<script>
const W=720,H=1280,FPS=30;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const io=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const eo=t=>1-Math.pow(1-clamp(t),3);
const lerp=(a,b,t)=>a+(b-a)*t;
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const rnd=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const $=id=>document.getElementById(id);
function run(draw){const tl=gsap.timeline({paused:true});const P={t:0};
  tl.to(P,{t:5,duration:5,ease:"none",onUpdate:()=>draw(P.t)},0);draw(0);window.__timelines["main"]=tl;}

const books=["#c2410c","#1d4ed8","#15803d","#a16207","#7e22ce","#be123c"];
$("books").innerHTML=books.map((c,i)=>`<div style="position:absolute;left:${540+i*38}px;top:${260+(i%2)*14}px;width:30px;height:${80-(i%2)*14}px;background:${c}"></div>`).join("");
$("plant").innerHTML=[0,1,2].map(i=>`<div style="position:absolute;left:${560+i*36}px;top:${770-i*30+(i===1?-20:0)}px;width:60px;height:130px;background:#2f855a;border-radius:50%;transform:rotate(${(i-1)*24}deg)"></div>`).join("");
run(t=>{$("world").style.transform=`scale(${lerp(1.72,.7,io(seg(t,.5,3.8)))})`});

</script></body></html>
