<!doctype html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=720, height=1280">
<title>Impact manga</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
@font-face{font-family:'Arial Black';src:local('Arial Black')}
@font-face{font-family:'Segoe UI Black';src:local('Segoe UI Black')}
@font-face{font-family:'Impact';src:local('Impact')}
@font-face{font-family:'Segoe UI';src:local('Segoe UI')}
@font-face{font-family:'Arial';src:local('Arial')}
@font-face{font-family:'Consolas';src:local('Consolas')}
@font-face{font-family:'Georgia';src:local('Georgia')}
@font-face{font-family:'Times New Roman';src:local('Times New Roman')}
@font-face{font-family:'Segoe Print';src:local('Segoe Print')}
@font-face{font-family:'Comic Sans MS';src:local('Comic Sans MS')}
@font-face{font-family:'Segoe UI Symbol';src:local('Segoe UI Symbol')}
@font-face{font-family:'Segoe Script';src:local('Segoe Script')}
html,body{margin:0;background:#000}
#root{position:relative;width:100%;height:100%;overflow:hidden;background:#000}
.a{position:absolute}
.vid{position:absolute;left:0;top:0;width:720px;height:1280px;object-fit:cover}
.heavy{font-family:'Arial Black','Segoe UI Black',Impact,sans-serif}
.ui{font-family:'Segoe UI',Arial,sans-serif}
#chip{position:absolute;left:22px;top:22px;padding:6px 16px;border-radius:20px;background:rgba(0,0,0,.6);color:#fff;
 font:700 22px 'Segoe UI',Arial,sans-serif;z-index:500}
#zw{inset:0}
#lines{left:-540px;top:-260px;width:1800px;height:1800px;background:repeating-conic-gradient(from 0deg at 50% 50%,#fff 0 1.1deg,rgba(255,255,255,0) 1.1deg 4.2deg);
 -webkit-mask-image:radial-gradient(circle,transparent 24%,#000 62%);mask-image:radial-gradient(circle,transparent 24%,#000 62%);z-index:2}
#dots{inset:0;background-image:radial-gradient(circle,#000 3px,transparent 4px);background-size:22px 22px;opacity:.22;mix-blend-mode:multiply;z-index:2;
 -webkit-mask-image:linear-gradient(180deg,transparent 35%,#000);mask-image:linear-gradient(180deg,transparent 35%,#000)}
.burst{z-index:5}
.burst text{font-family:'Arial Black',Impact,sans-serif;font-weight:900;font-size:90px;fill:#e11d2e;stroke:#000;stroke-width:8px;paint-order:stroke;text-anchor:middle}
</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-width="720" data-height="1280" data-duration="5">
<div id="zw" class="a"><video id="gv" class="vid" src="clip.mp4" muted playsinline data-start="0" data-duration="5" data-track-index="0" style="filter:grayscale(1) contrast(1.7) brightness(.95)"></video></div>
<div id="lines" class="a"></div><div id="dots" class="a"></div>
<video id="cut" class="vid" src="cut.webm" muted playsinline data-start="0" data-duration="5" data-track-index="1" style="z-index:3;filter:saturate(1.25) contrast(1.1)"></video>
<svg id="b1" class="a burst" width="720" height="1280" style="left:0;top:0"><g id="g1"><polygon id="s1" fill="#ffe14d" stroke="#000" stroke-width="8" stroke-linejoin="round"/><text x="0" y="30">BOOM!</text></g></svg>
<svg id="b2" class="a burst" width="720" height="1280" style="left:0;top:0"><g id="g2"><polygon id="s2" fill="#ffe14d" stroke="#000" stroke-width="8" stroke-linejoin="round"/><text x="0" y="30">YEAH!</text></g></svg>

</div>
<script>
const W=720,H=1280,FPS=30;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const io=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const eo=t=>1-Math.pow(1-clamp(t),3);
const lerp=(a,b,t)=>a+(b-a)*t;
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const rnd=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const $=id=>document.getElementById(id);
function run(draw){const tl=gsap.timeline({paused:true});const P={t:0};
  tl.to(P,{t:5,duration:5,ease:"none",onUpdate:()=>draw(P.t)},0);draw(0);window.__timelines["main"]=tl;}

const back=p=>{p=clamp(p);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2)};
const star=(r)=>Array.from({length:24}).map((_,i)=>{const a=i*Math.PI/12,rr=i%2?r*.68:r;return `${rr*Math.cos(a)},${rr*Math.sin(a)}`}).join(" ");
$("s1").setAttribute("points",star(200));$("s2").setAttribute("points",star(170));
run(t=>{
  const pulse=(c)=>1+.11*Math.sin(Math.PI*seg(t,c,c+.7));
  const z=pulse(1.0)*pulse(3.0);
  $("zw").style.transform=`scale(${z})`;$("cut").style.transform=`scale(${z})`;
  const li=seg(t,.9,1.1)*(1-seg(t,2.2,2.6))+seg(t,2.9,3.1)*(1-seg(t,4.2,4.6));
  $("lines").style.opacity=clamp(li)*.9;$("lines").style.transform=`rotate(${t*7}deg)`;
  const p1=back(seg(t,1,1.45))*(1-seg(t,2.6,3)),p2=back(seg(t,3,3.45))*(1-seg(t,4.5,4.9));
  $("g1").setAttribute("transform",`translate(520 250) rotate(-8) scale(${Math.max(0,p1)})`);
  $("g2").setAttribute("transform",`translate(210 1010) rotate(7) scale(${Math.max(0,p2)})`);
});

</script></body></html>
