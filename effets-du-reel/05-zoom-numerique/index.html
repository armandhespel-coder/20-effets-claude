<!doctype html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=720, height=1280">
<title>Zoom numérique façon caméra</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
@font-face{font-family:'Arial Black';src:local('Arial Black')}
@font-face{font-family:'Segoe UI Black';src:local('Segoe UI Black')}
@font-face{font-family:'Impact';src:local('Impact')}
@font-face{font-family:'Segoe UI';src:local('Segoe UI')}
@font-face{font-family:'Arial';src:local('Arial')}
@font-face{font-family:'Consolas';src:local('Consolas')}
@font-face{font-family:'Georgia';src:local('Georgia')}
@font-face{font-family:'Times New Roman';src:local('Times New Roman')}
@font-face{font-family:'Segoe Print';src:local('Segoe Print')}
@font-face{font-family:'Comic Sans MS';src:local('Comic Sans MS')}
@font-face{font-family:'Segoe UI Symbol';src:local('Segoe UI Symbol')}
@font-face{font-family:'Segoe Script';src:local('Segoe Script')}
html,body{margin:0;background:#000}
#root{position:relative;width:100%;height:100%;overflow:hidden;background:#000}
.a{position:absolute}
.vid{position:absolute;left:0;top:0;width:720px;height:1280px;object-fit:cover}
.heavy{font-family:'Arial Black','Segoe UI Black',Impact,sans-serif}
.ui{font-family:'Segoe UI',Arial,sans-serif}
#chip{position:absolute;left:22px;top:22px;padding:6px 16px;border-radius:20px;background:rgba(0,0,0,.6);color:#fff;
 font:700 22px 'Segoe UI',Arial,sans-serif;z-index:500}
#zw{inset:0;transform-origin:49% 55%}
#scan{inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.10) 0 2px,transparent 2px 4px);z-index:2}
.br{position:absolute;width:56px;height:56px;border:0 solid #fff;z-index:3}
#rec{left:70px;top:84px;display:flex;align-items:center;gap:12px;font:28px Consolas,monospace;color:#fff;z-index:3}
#dot{width:18px;height:18px;border-radius:9px;background:#ff3b30}
#box{left:220px;top:540px;width:260px;height:320px;border:4px solid #fff;border-radius:12px;z-index:3}
#rail{right:44px;top:380px;width:8px;height:440px;background:rgba(255,255,255,.4);border-radius:4px;z-index:3}
#knob{position:absolute;left:-9px;width:26px;height:26px;border-radius:13px;background:#fff}
#zt{left:0;right:0;bottom:150px;text-align:center;font-size:64px;color:#fff;text-shadow:0 4px 14px rgba(0,0,0,.6);z-index:3}
</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-width="720" data-height="1280" data-duration="5">
<div id="zw" class="a"><video class="vid" src="clip.mp4" muted playsinline data-start="0" data-duration="5" data-track-index="0"></video></div>
<div id="scan" class="a"></div>
<div class="br" style="left:36px;top:70px;border-left-width:5px;border-top-width:5px"></div>
<div class="br" style="right:36px;top:70px;border-right-width:5px;border-top-width:5px"></div>
<div class="br" style="left:36px;bottom:120px;border-left-width:5px;border-bottom-width:5px"></div>
<div class="br" style="right:36px;bottom:120px;border-right-width:5px;border-bottom-width:5px"></div>
<div id="rec" class="a"><div id="dot"></div><span id="rect"></span></div>
<div id="box" class="a"></div>
<div id="rail" class="a"><div id="knob"></div></div>
<div id="zt" class="a heavy"></div>

</div>
<script>
const W=720,H=1280,FPS=30;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const io=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const eo=t=>1-Math.pow(1-clamp(t),3);
const lerp=(a,b,t)=>a+(b-a)*t;
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const rnd=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const $=id=>document.getElementById(id);
function run(draw){const tl=gsap.timeline({paused:true});const P={t:0};
  tl.to(P,{t:5,duration:5,ease:"none",onUpdate:()=>draw(P.t)},0);draw(0);window.__timelines["main"]=tl;}

run(t=>{
  const z=1+1.7*io(seg(t,.4,3.4)),lock=seg(t,3.4,3.6);
  $("zw").style.transform=`scale(${z})`;
  $("dot").style.opacity=Math.floor(t*2)%2?.2:1;$("rect").textContent="REC 00:0"+Math.floor(t);
  const b=$("box");b.style.borderColor=lock>.5?"#34d399":"#fff";b.style.opacity=eo(seg(t,.9,1.3));b.style.transform=`scale(${1.3-.3*eo(seg(t,.9,1.5))})`;
  $("knob").style.top=(414-414*((z-1)/1.7))+"px";$("zt").textContent=z.toFixed(1)+"x";
});

</script></body></html>
