<!doctype html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=720, height=1280">
<title>Fond vert, sans fond vert</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
@font-face{font-family:'Arial Black';src:local('Arial Black')}
@font-face{font-family:'Segoe UI Black';src:local('Segoe UI Black')}
@font-face{font-family:'Impact';src:local('Impact')}
@font-face{font-family:'Segoe UI';src:local('Segoe UI')}
@font-face{font-family:'Arial';src:local('Arial')}
@font-face{font-family:'Consolas';src:local('Consolas')}
@font-face{font-family:'Georgia';src:local('Georgia')}
@font-face{font-family:'Times New Roman';src:local('Times New Roman')}
@font-face{font-family:'Segoe Print';src:local('Segoe Print')}
@font-face{font-family:'Comic Sans MS';src:local('Comic Sans MS')}
@font-face{font-family:'Segoe UI Symbol';src:local('Segoe UI Symbol')}
@font-face{font-family:'Segoe Script';src:local('Segoe Script')}
html,body{margin:0;background:#000}
#root{position:relative;width:100%;height:100%;overflow:hidden;background:#000}
.a{position:absolute}
.vid{position:absolute;left:0;top:0;width:720px;height:1280px;object-fit:cover}
.heavy{font-family:'Arial Black','Segoe UI Black',Impact,sans-serif}
.ui{font-family:'Segoe UI',Arial,sans-serif}
#chip{position:absolute;left:22px;top:22px;padding:6px 16px;border-radius:20px;background:rgba(0,0,0,.6);color:#fff;
 font:700 22px 'Segoe UI',Arial,sans-serif;z-index:500}
#g1{inset:0;background:#00d84a;background-image:radial-gradient(circle,rgba(0,0,0,.18) 3px,transparent 4px);background-size:90px 90px}
#g2{inset:0;background:linear-gradient(#ff7a59 0%,#ffc371 45%,#3a1c5a 80%);overflow:hidden}
#g3{inset:0;background:linear-gradient(#12002b,#3a0a63 60%,#ff2e97);overflow:hidden}
#floor{left:-640px;top:780px;width:2000px;height:900px;transform-origin:50% 0;transform:perspective(300px) rotateX(58deg);
 background-image:linear-gradient(rgba(255,46,151,.9) 3px,transparent 3px),linear-gradient(90deg,rgba(255,46,151,.9) 3px,transparent 3px);background-size:90px 90px}
#stage{right:30px;top:80px;padding:8px 22px;border-radius:30px;background:#000a;color:#fff;font-weight:800;font-size:28px;z-index:6}
</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-width="720" data-height="1280" data-duration="5">
<video class="vid" src="clip.mp4" muted playsinline data-start="0" data-duration="5" data-track-index="0"></video>
<div id="g1" class="a"></div>
<div id="g2" class="a"><div class="a" style="left:210px;top:380px;width:300px;height:300px;border-radius:150px;background:radial-gradient(#fff6c8,#ffd27a)"></div><div id="city"></div></div>
<div id="g3" class="a"><div class="a" style="left:210px;top:330px;width:300px;height:300px;border-radius:150px;background:linear-gradient(#ffd23f,#ff2e97)"></div><div id="floor" class="a"></div></div>
<video id="cut" class="vid" src="cut.webm" muted playsinline data-start="0" data-duration="5" data-track-index="1" style="z-index:5"></video>
<div id="stage" class="a ui"></div>

</div>
<script>
const W=720,H=1280,FPS=30;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const io=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const eo=t=>1-Math.pow(1-clamp(t),3);
const lerp=(a,b,t)=>a+(b-a)*t;
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const rnd=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const $=id=>document.getElementById(id);
function run(draw){const tl=gsap.timeline({paused:true});const P={t:0};
  tl.to(P,{t:5,duration:5,ease:"none",onUpdate:()=>draw(P.t)},0);draw(0);window.__timelines["main"]=tl;}

$("city").innerHTML=Array.from({length:14}).map((_,i)=>`<div style="position:absolute;left:${i*53}px;bottom:0;width:50px;height:${160+rnd(i)*360}px;background:#1b1030"></div>`).join("");
run(t=>{
  const w1=io(seg(t,.7,1.2)),w2=io(seg(t,1.9,2.5)),w3=io(seg(t,3.4,4));
  $("g1").style.clipPath=`inset(0 ${(1-w1)*100}% 0 0)`;
  $("g2").style.clipPath=`inset(${(1-w2)*100}% 0 0 0)`;
  $("g3").style.clipPath=`inset(0 0 0 ${(1-w3)*100}%)`;
  $("floor").style.backgroundPosition=`0 ${(t*120)%90}px`;
  const s=t<.7?"":t<1.9?"FOND VERT":t<3.4?"VILLE":"NÉON";$("stage").textContent=s;$("stage").style.display=s?"block":"none";
});

</script></body></html>
